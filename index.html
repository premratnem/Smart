<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2B6CB0">
<title>Smart Self Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#2B6CB0; --brand-d:#1E4E8C; --brand-soft:#EBF2FB;
    --bg:#F5F8FC; --card:#FFFFFF;
    --ink:#1F2D3D; --muted:#5A6B7B; --line:#E3EAF2;
    --red:#C0392B;   --red-bg:#FDEDEA;   --red-line:#F3C4BD;
    --amber:#B9770E; --amber-bg:#FDF4E3; --amber-line:#F0DBA8;
    --green:#1E8A5B; --green-bg:#E7F6EE; --green-line:#B4E0C8;
    --fs:18px; --radius:14px;
  }
  body.hc{
    --brand:#0B3D91; --brand-d:#082B66; --brand-soft:#E3ECFF;
    --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#1a1a1a; --line:#000000;
    --red:#B00000; --red-bg:#ffffff; --red-line:#B00000;
    --amber:#8A5A00; --amber-bg:#ffffff; --amber-line:#8A5A00;
    --green:#00662E; --green-bg:#ffffff; --green-line:#00662E;
  }
  body.hc .card, body.hc .advice, body.hc .facility, body.hc .kbox,
  body.hc .refs, body.hc .opt, body.hc .hotline, body.hc .mock{border-width:2px;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"Sarabun","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7; font-size:var(--fs); -webkit-text-size-adjust:100%;
  }
  a:focus-visible, button:focus-visible, summary:focus-visible, .opt:focus-visible{
    outline:3px solid var(--brand); outline-offset:2px; border-radius:6px;
  }
  .app{max-width:620px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}
  /* แบนเนอร์สถานะการรับรอง (ของใหม่) */
  .mock{
    background:var(--amber-bg); color:var(--amber); border-bottom:2px solid var(--amber-line);
    font-size:12.5px; font-weight:700; text-align:center; padding:8px 14px; line-height:1.5;
  }
  header{
    background:var(--brand); color:#fff; padding:16px 20px; position:sticky; top:0; z-index:10;
    box-shadow:0 2px 8px rgba(43,108,176,.18);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    flex:0 0 auto; height:48px; background:#fff; padding:5px 9px; border-radius:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.16);
    display:flex; align-items:center; justify-content:center;
  }
  .brand .mark img{display:block; height:100%; width:auto;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  header h1{margin:0; font-size:22px; font-weight:800; letter-spacing:.3px;}
  header p{margin:2px 0 0; font-size:12px; opacity:.9; font-weight:400;}
  .a11y-bar{display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .a11y-bar .lbl{font-size:11.5px; opacity:.9; margin-right:2px;}
  .a11y-btn{
    min-width:40px; height:34px; padding:0 10px; border:1.5px solid rgba(255,255,255,.55); background:rgba(255,255,255,.12);
    color:#fff; border-radius:8px; font-family:inherit; font-weight:700; cursor:pointer; font-size:13px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .a11y-btn[aria-pressed="true"]{background:#fff; color:var(--brand); border-color:#fff;}
  .a11y-btn.big{font-size:16px;}
  .progress{height:6px; background:rgba(255,255,255,.28); margin-top:14px; overflow:hidden; border-radius:6px;}
  .progress > div{height:100%; background:#fff; width:0; transition:width .3s ease; border-radius:6px;}
  main{flex:1; padding:22px 20px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; box-shadow:0 2px 10px rgba(43,108,176,.07);}
  .step-count{font-size:.72em; color:var(--brand); margin-bottom:8px; font-weight:700; letter-spacing:.3px;}
  .q-title{font-size:1.12em; font-weight:700; margin:0 0 6px; color:var(--ink); line-height:1.4;}
  .q-sub{font-size:.78em; color:var(--muted); margin:0 0 20px;}
  .opt{
    display:flex; align-items:center; gap:14px; width:100%;
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:17px 18px; margin-bottom:12px; cursor:pointer; min-height:44px;
    font-size:.92em; text-align:left; color:var(--ink); transition:all .15s; font-family:inherit;
  }
  .opt:active{transform:scale(.995);}
  .opt.sel{border-color:var(--brand); background:var(--brand-soft); box-shadow:inset 0 0 0 1px var(--brand);}
  .opt .box{
    flex:0 0 24px; height:24px; border:2px solid #BBC8D8; border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; transition:all .15s;
  }
  .opt.sel .box{background:var(--brand); border-color:var(--brand);}
  .opt.single .box{border-radius:50%;}
  .opt.flag.sel{border-color:var(--red); background:var(--red-bg); box-shadow:inset 0 0 0 1px var(--red);}
  .opt.flag.sel .box{background:var(--red); border-color:var(--red);}
  .opt .ohint{display:block; font-size:.8em; color:var(--muted); font-weight:400; margin-top:2px;}
  /* รูปภาพประกอบตัวเลือก (ใช้ในคำถามสัญญาณอันตราย) */
  .opt .othumb{
    flex:0 0 56px; width:56px; height:56px; border-radius:10px; overflow:hidden;
    background:var(--red-bg); border:1.5px solid var(--red-line);
    display:flex; align-items:center; justify-content:center;
  }
  .opt .othumb img{width:100%; height:100%; object-fit:contain; display:block;}
  .opt.has-img{align-items:center;}
  .opt.flag.sel .othumb{border-color:var(--red);}
  body.hc .opt .othumb{border-width:2px;}
  body.hc .opt .othumb img{filter:brightness(.55) contrast(1.3);}
  .nav{display:flex; gap:12px; margin-top:26px;}
  button.btn{
    flex:1; border:none; border-radius:12px; padding:17px; font-size:.95em; font-weight:700;
    cursor:pointer; font-family:inherit; transition:all .15s; letter-spacing:.2px; min-height:44px;
  }
  .btn-primary{background:var(--brand); color:#fff; box-shadow:0 2px 6px rgba(43,108,176,.25);}
  .btn-primary:disabled{background:#B5C3D4; box-shadow:none; cursor:not-allowed;}
  .btn-primary:not(:disabled):active{background:var(--brand-d);}
  .btn-ghost{flex:0 0 auto; background:var(--brand-soft); color:var(--brand-d); padding:17px 22px; border:1.5px solid var(--line);}
  .btn-block{width:100%; flex:none;}
  /* result */
  .result-banner{border-radius:var(--radius); padding:22px 20px; margin-bottom:18px; display:flex; align-items:center; gap:16px;}
  .result-banner .level-tag{flex:0 0 56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#fff;}
  .result-banner .rtext h2{margin:0 0 3px; font-size:1.08em; line-height:1.35;}
  .result-banner .rtext p{margin:0; font-size:.78em; font-weight:600; opacity:.92;}
  .lv-red{background:var(--red-bg); color:var(--red); border:1.5px solid var(--red-line);}
  .lv-red .level-tag{background:var(--red);}
  .lv-amber{background:var(--amber-bg); color:var(--amber); border:1.5px solid var(--amber-line);}
  .lv-amber .level-tag{background:var(--amber);}
  .lv-green{background:var(--green-bg); color:var(--green); border:1.5px solid var(--green-line);}
  .lv-green .level-tag{background:var(--green);}
  .alert-strong{
    background:var(--red); color:#fff; border-radius:var(--radius); padding:20px;
    margin-bottom:16px; display:flex; gap:14px; align-items:flex-start;
    box-shadow:0 4px 14px rgba(192,57,43,.3); animation:pulse 1.6s ease-in-out infinite;
  }
  .alert-strong .ai{flex:0 0 34px; height:34px; border:3px solid #fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px;}
  .alert-strong .at{font-size:.92em; font-weight:700; line-height:1.5;}
  @keyframes pulse{0%,100%{box-shadow:0 4px 14px rgba(192,57,43,.3);} 50%{box-shadow:0 4px 22px rgba(192,57,43,.55);}}
  @media (prefers-reduced-motion: reduce){ .alert-strong{animation:none;} .fade{animation:none;} }
  .advice{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
  .advice h3{margin:0 0 12px; font-size:.86em; color:var(--brand-d); padding-bottom:10px; border-bottom:1px solid var(--line);}
  .advice ul{margin:0; padding-left:20px;} .advice li{margin-bottom:10px; font-size:.84em;}
  .reasons{font-size:.78em; color:var(--muted); background:var(--brand-soft); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px;}
  .reasons b{color:var(--ink); display:block; margin-bottom:8px; font-size:1.03em;}
  .trace{font-size:.68em; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); word-break:break-all;}
  .call{display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; text-align:center; background:var(--red); color:#fff; font-weight:800; font-size:1.05em; padding:18px; border-radius:12px; margin-bottom:16px; letter-spacing:.3px; min-height:44px;}
  .call .num{font-size:1.3em;}
  .disclaimer{font-size:.7em; color:var(--muted); background:var(--brand-soft); border:1px solid var(--line); border-radius:12px; padding:15px 17px; line-height:1.65;}
  .disclaimer b{color:var(--ink);}
  .facility{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
  .facility h3{margin:0 0 14px; font-size:.86em; color:var(--brand-d); padding-bottom:10px; border-bottom:1px solid var(--line);}
  .btn-find{width:100%; border:none; background:var(--brand); color:#fff; font-family:inherit; font-weight:700; font-size:.9em; padding:16px; border-radius:12px; cursor:pointer; letter-spacing:.2px; min-height:44px;}
  .facility-note{font-size:.72em; color:var(--muted); margin:12px 2px 0; line-height:1.6;}
  .hotlines{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .hotline{display:flex; align-items:center; gap:14px; text-decoration:none; background:var(--brand-soft); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-height:44px;}
  .hl-num{flex:0 0 auto; font-size:1.1em; font-weight:800; color:var(--brand-d); letter-spacing:.5px;}
  .hl-label{font-size:.72em; color:var(--ink); line-height:1.4;}
  .know-wrap{margin-bottom:16px;}
  .know-title{font-size:.86em; margin:0 0 11px; color:var(--brand-d); padding-bottom:9px; border-bottom:2px solid var(--brand); display:inline-block;}
  .kbox{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:10px; padding:16px 18px; margin-bottom:11px;}
  .khead{font-weight:700; font-size:.84em; margin-bottom:7px; color:var(--brand-d);}
  .kbody{font-size:.8em; color:var(--ink); line-height:1.75;}

  /* ===== หน้าสัญญาณอันตราย แบบรูปภาพประกอบ (visual, เข้าใจง่าย) ===== */
  .danger-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  @media (max-width:380px){ .danger-grid{grid-template-columns:1fr;} }
  .dcard{
    background:var(--card); border:2px solid var(--red-line); border-radius:16px;
    padding:0 0 14px; text-align:center; display:flex; flex-direction:column;
    align-items:center; overflow:hidden; box-shadow:0 2px 10px rgba(192,57,43,.08);
  }
  .dcard .ill{
    width:100%; aspect-ratio:1/1; background:var(--red-bg);
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
    border-bottom:2px solid var(--red-line); padding:14px;
  }
  .dcard .ill img{width:100%; height:100%; object-fit:contain; display:block;}
  .dcard .dtitle{font-weight:800; font-size:.92em; color:var(--red); line-height:1.4; margin:0 10px 6px;}
  .dcard .ddesc{font-size:.76em; color:var(--muted); line-height:1.55; margin:0 10px;}
  body.hc .dcard{border-width:3px;}
  body.hc .dcard .ill{border-bottom-width:3px;}
  /* คอนทราสต์สูง: เพิ่มความเข้มของเส้นไอคอนให้คมชัดขึ้น */
  body.hc .dcard .ill img{filter:brightness(.55) contrast(1.3);}
  .attr{text-align:center; font-size:.66em; color:var(--muted); margin:-6px 0 16px;}
  .attr a{color:var(--brand); text-decoration:underline;}
  .refs{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 18px; margin-bottom:16px;}
  .refs summary{cursor:pointer; font-weight:700; font-size:.78em; padding:14px 0; color:var(--brand-d);}
  .reflist{margin:0 0 14px; padding-left:4px; list-style:none;}
  .reflist li{font-size:.68em; color:var(--muted); line-height:1.6; margin-bottom:10px;}
  .refnum{color:var(--brand); font-weight:700; margin-right:4px;}
  .followup{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
  .followup h3{margin:0 0 12px; font-size:.86em; color:var(--brand-d); padding-bottom:10px; border-bottom:1px solid var(--line);}
  .followup ul{margin:0; padding-left:20px;} .followup li{margin-bottom:10px; font-size:.84em;}
  footer{text-align:center; font-size:.64em; color:var(--muted); padding:18px 16px; line-height:1.6;}
  .intro h2{margin:4px 0 14px; font-size:1.2em; color:var(--brand-d); line-height:1.4;}
  .intro .lead{font-size:.88em; color:var(--ink);}
  .intro ul{padding-left:20px; margin:14px 0;} .intro li{margin-bottom:10px; font-size:.84em;}
  .home-btn{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:18px; margin-bottom:12px; cursor:pointer; font-family:inherit; color:var(--ink); font-size:.95em; font-weight:700; min-height:44px;}
  .home-btn .hic{flex:0 0 30px; font-size:1.3em; text-align:center;}
  .home-btn small{display:block; font-weight:400; color:var(--muted); font-size:.78em;}
  .home-btn.danger{border-color:var(--red-line); color:var(--red);}

  /* ===== หน้าแรกสไตล์โมบายล์ (hero) ===== */
  .hero{
    text-align:center; padding:0;
    background:linear-gradient(180deg,#EAF2FB 0%, #F5F8FC 60%, var(--bg) 100%);
  }
  .hero-title{
    margin:0; font-weight:800; letter-spacing:.5px; line-height:1.08;
    font-size:2em; text-transform:uppercase;
    background:linear-gradient(90deg,#1E6FD0,#1E4E8C);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{margin:8px 0 0; font-size:.82em; color:var(--muted); font-weight:600; letter-spacing:.3px;}
  .hero-logo{
    width:min(300px,78%); margin:8px auto 4px;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 10px 20px rgba(30,78,140,.16));
  }
  .hero-logo img{width:100%; height:auto; display:block;}
  body.hc .hero-title{color:var(--brand-d); -webkit-text-fill-color:var(--brand-d);}

  /* การ์ดสถานพยาบาลใกล้เคียง */
  .nearby{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px 14px; margin:18px 0 16px; cursor:pointer; font-family:inherit;
    color:var(--ink); box-shadow:0 4px 14px rgba(30,78,140,.08);
  }
  .nearby .nb-text{flex:1; font-weight:700; font-size:.9em; line-height:1.35;}
  .nearby .nb-text small{display:block; font-weight:400; color:var(--muted); font-size:.82em; margin-top:2px;}
  .nearby .nb-map{
    flex:0 0 92px; height:56px; border-radius:10px; position:relative; overflow:hidden;
    background:
      linear-gradient(90deg, transparent 46%, #CBD8E6 46%, #CBD8E6 50%, transparent 50%),
      linear-gradient(0deg, transparent 60%, #CBD8E6 60%, #CBD8E6 63%, transparent 63%),
      #E8EFF6;
  }
  .nearby .nb-pin{position:absolute; top:50%; left:50%; transform:translate(-50%,-60%); font-size:20px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}

  /* ปุ่ม CTA หลัก */
  .cta{
    width:100%; border:none; cursor:pointer; font-family:inherit; color:#fff;
    font-weight:800; font-size:1.02em; letter-spacing:.5px; text-transform:uppercase;
    padding:18px; border-radius:40px; min-height:56px;
    background:linear-gradient(90deg,#2B6CB0,#1E4E8C);
    box-shadow:0 8px 22px rgba(30,78,140,.32);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{transform:translateY(1px); box-shadow:0 4px 12px rgba(30,78,140,.28);}
  body.hc .cta{background:var(--brand); border:2px solid var(--ink);}

  /* bottom navigation */
  .tabbar{
    position:sticky; bottom:0; z-index:10; display:flex; background:var(--card);
    border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(30,78,140,.06);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1; background:none; border:none; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:11px; font-weight:600; padding:6px 0;
  }
  .tabbar button .ti{font-size:19px; line-height:1;}
  .tabbar button.active{color:var(--brand);}
  .tabbar button.active .ti{transform:translateY(-1px);}

  .fade{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;}}
</style>
</head>
<body>
<div class="app">
  <div class="mock" id="envBanner" role="note">
    กำลังตรวจสอบสถานะชุดกฎ…
  </div>
  <header>
    <div class="brand">
      <div class="mark">
        <img src="logo.png" alt="โลโก้ Smart Self Triage" width="269" height="203">
      </div>
      <div>
        <h1>Smart Self Triage</h1>
      </div>
    </div>
    <div class="a11y-bar" role="group" aria-label="การตั้งค่าการเข้าถึง">
      <span class="lbl">ขนาดตัวอักษร</span>
      <button class="a11y-btn" onclick="setFont(-1)" aria-label="ลดขนาดตัวอักษร">A−</button>
      <button class="a11y-btn big" onclick="setFont(0)" aria-label="ขนาดตัวอักษรปกติ">A</button>
      <button class="a11y-btn" onclick="setFont(1)" aria-label="เพิ่มขนาดตัวอักษร">A+</button>
      <button class="a11y-btn" id="hcBtn" onclick="toggleContrast()" aria-pressed="false" aria-label="สลับโหมดคอนทราสต์สูง">คอนทราสต์สูง</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
  </header>
  <main id="main"></main>
  <footer>ใช้เพื่อการประเมินเบื้องต้นเท่านั้น หากไม่แน่ใจหรือมีอาการรุนแรง โปรดไปสถานพยาบาลที่ใกล้ที่สุด หรือโทร 1669</footer>
  <nav class="tabbar" aria-label="เมนูหลัก">
    <button id="tab-home" class="active" onclick="renderIntro()"><span class="ti" aria-hidden="true">🏠</span>หน้าแรก</button>
    <button id="tab-history" onclick="renderSelfcare()"><span class="ti" aria-hidden="true">🕑</span>ดูแลตนเอง</button>
    <button id="tab-settings" onclick="renderDanger()"><span class="ti" aria-hidden="true">⚠️</span>สัญญาณอันตราย</button>
  </nav>
</div>

<!-- Engine + config + ชุดกฎ production (deterministic + versioned + governance) -->
<script src="triage-engine.js"></script>
<script src="config.js"></script>
<script src="rulesets.js"></script>
<script>
/* ============================================================
   UI LAYER — แยกจาก logic การประเมินโดยสมบูรณ์
   การประเมินทั้งหมดเรียกผ่าน TriageEngine.evaluate(answers, ruleSet, opts)
   - RUN_ENV มาจาก config.js (จุดสลับ environment กลางที่เดียว)
   - RULESET มาจาก rulesets.js (ชุดกฎ production; จะเป็น approved/production
     ก็ต่อเมื่อผู้เชี่ยวชาญคลินิกลงนามอนุมัติแล้วเท่านั้น)
   ============================================================ */
var RUN_ENV = (window.TriageConfig && window.TriageConfig.RUN_ENV) || "test";
var RULESET = (window.ProductionRuleSets && window.ProductionRuleSets.RULESET) || null;

/* ตรวจสถานะชุดกฎครั้งเดียวตอนโหลด — ใช้คุม guard + ข้อความแบนเนอร์ */
var GATE = (function () {
  try {
    if (!RULESET) return { ok: false, reason: "ไม่พบชุดกฎ (rulesets.js ไม่ได้โหลด)" };
    var vErr = TriageEngine.validateRuleSet(RULESET);
    if (vErr.length) return { ok: false, reason: "ชุดกฎไม่ผ่านการตรวจสอบโครงสร้าง" };
    var g = TriageEngine.assertUsable(RULESET, RUN_ENV);
    if (!g.usable) return { ok: false, reason: g.reason };
    return { ok: true, reason: "" };
  } catch (e) {
    return { ok: false, reason: (e && e.message) || String(e) };
  }
})();

/* แบนเนอร์สถานะ: สะท้อนสถานะจริงของชุดกฎ + environment */
(function setEnvBanner() {
  var el = document.getElementById("envBanner");
  if (!el) return;
  if (RUN_ENV === "production" && GATE.ok) {
    el.textContent = "โหมดใช้งานจริง — ชุดกฎที่อนุมัติแล้ว (" +
      (RULESET.id + "@" + RULESET.version) + ")";
    el.style.background = "var(--green-bg)";
    el.style.color = "var(--green)";
    el.style.borderBottomColor = "var(--green-line)";
  } else if (RUN_ENV === "production" && !GATE.ok) {
    el.textContent = "โหมด production ถูกร้องขอ แต่ชุดกฎยังไม่ผ่านการอนุมัติ — ระบบจะไม่ประเมินจนกว่าจะมีชุดกฎที่อนุมัติ";
    el.style.background = "var(--red-bg)";
    el.style.color = "var(--red)";
    el.style.borderBottomColor = "var(--red-line)";
  } else {
    el.textContent = "โหมดทดสอบ — ใช้ชุดกฎที่ยังไม่รับรองทางคลินิก (environment=test) ห้ามใช้ตัดสินใจจริง";
  }
})();

function renderQuestion(){
  var q = QUESTIONS[state.step];
  setBar();
  var cur = state.answers[q.id];
  var opts = q.options.map(function(o){
    var sel = (q.type==='single') ? cur===o.v : (isArr(cur) && cur.indexOf(o.v)!==-1);
    var isFlagOpt = q.flag && o.v!=='none';
    var check = q.type==='single' ? '●' : '✓';
    var thumb = o.img
      ? '<span class="othumb"><img src="'+o.img+'" alt="" aria-hidden="true" loading="lazy" decoding="async"></span>'
      : '';
    return '<button class="opt '+(q.type==='single'?'single':'')+' '+(isFlagOpt?'flag':'')+' '+(o.img?'has-img':'')+' '+(sel?'sel':'')+'" '+
      'onclick="pick(\''+q.id+'\',\''+o.v+'\','+(o.clears?'true':'false')+')">'+
      '<span class="box">'+(sel?check:'')+'</span>'+
      thumb +
      '<span>'+o.label+(o.hint?'<span class="ohint">'+o.hint+'</span>':'')+'</span></button>';
  }).join('');
  var canNext = (q.type==='single') ? !!cur : (isArr(cur) && cur.length>0);
  // ถ้าอยู่ข้อ 1 และเลือกสัญญาณอันตรายไว้ -> การกดจะข้ามไปหน้าผล "ฉุกเฉิน" ทันที
  var rfShortcut = (state.step===0 && hasRedFlag());
  var nextLabel = (state.step===TOTAL-1 || rfShortcut) ? 'ดูผลการประเมิน' : 'ถัดไป';
  var rfNote = rfShortcut
    ? '<p class="q-sub" style="color:var(--red);margin:14px 0 0"><b>ตรวจพบสัญญาณอันตราย</b> — ระบบจะแสดงผลเป็นภาวะฉุกเฉินทันที โดยไม่ต้องตอบคำถามที่เหลือ</p>'
    : '';
  mainEl.innerHTML =
    '<div class="card fade">' +
      '<div class="step-count">คำถามที่ '+(state.step+1)+' จาก '+TOTAL+'</div>' +
      '<h2 class="q-title">'+q.title+'</h2><p class="q-sub">'+q.sub+'</p>'+opts+ rfNote +
      '<div class="nav">' +
        (state.step>0?'<button class="btn btn-ghost" onclick="prev()">ย้อนกลับ</button>':'<button class="btn btn-ghost" onclick="renderIntro()">หน้าแรก</button>') +
        '<button class="btn btn-primary" '+(canNext?'':'disabled')+' onclick="next()">'+nextLabel+'</button>' +
      '</div>' +
    '</div>';
}

function isArr(x){ return Object.prototype.toString.call(x)==='[object Array]'; }

function pick(qid, val, clears){
  var q = QUESTIONS[findQ(qid)];
  if (q.type==='single'){ state.answers[qid]=val; }
  else {
    var arr = isArr(state.answers[qid]) ? state.answers[qid].slice() : [];
    if (clears){ arr = arr.indexOf(val)!==-1 ? [] : [val]; }
    else {
      arr = arr.filter(function(v){ var opt=qOpt(q,v); return !(opt&&opt.clears); });
      if (arr.indexOf(val)!==-1) arr = arr.filter(function(v){return v!==val;});
      else arr.push(val);
    }
    state.answers[qid]=arr;
  }
  renderQuestion();
}
function findQ(id){ for(var i=0;i<QUESTIONS.length;i++){ if(QUESTIONS[i].id===id) return i; } return -1; }
function qOpt(q,v){ for(var i=0;i<q.options.length;i++){ if(q.options[i].v===v) return q.options[i]; } return null; }

/* ตรวจว่าคำตอบข้อ redflag มีสัญญาณอันตราย (ไม่นับตัวเลือก "ไม่มีข้อใด") หรือไม่ */
function hasRedFlag(){
  var q = QUESTIONS[0]; // ข้อแรกคือ redflag
  if (!q || q.id!=='redflag') return false;
  var ans = state.answers.redflag;
  if (!isArr(ans)) return false;
  for (var i=0;i<ans.length;i++){
    var opt = qOpt(q, ans[i]);
    if (opt && !opt.clears) return true; // red flag จริง (ไม่ใช่ "ไม่มีข้อใด")
  }
  return false;
}

function next(){
  // RED-FLAG-FIRST (R3.2): ถ้าข้อ 1 มีสัญญาณอันตราย ให้ข้ามคำถามที่เหลือ
  // แล้วไปหน้าผลประเมิน "ฉุกเฉิน" ทันที โดยไม่ต้องตอบข้อถัด ๆ ไป
  if (state.step===0 && hasRedFlag()){ renderResult(); return; }
  if(state.step<TOTAL-1){ state.step++; renderQuestion(); } else { renderResult(); }
}
function prev(){ if(state.step>0){ state.step--; renderQuestion(); } }
function startQuiz(){
  // Guard: ไม่เริ่มประเมินถ้าชุดกฎใช้งานไม่ได้ (fail-safe ตาม R10.2 / R7.4)
  if (!GATE.ok){ renderGateBlocked(); return; }

}

/* สร้าง flag สำหรับเลือกกล่องความรู้ จากคำตอบ (UI สร้าง ไม่ใช่ engine) */
function deriveFlags(a){
  var rf = isArr(a.redflag)?a.redflag:[];
  var flags = {};
  if (rf.indexOf('stroke')!==-1 || a.main==='neuro') flags.stroke=1;
  if (rf.indexOf('chest')!==-1 || a.main==='chest') flags.chest=1;
  if (rf.indexOf('breath')!==-1 || a.main==='resp') flags.breath=1;
  if (rf.indexOf('unconscious')!==-1) flags.conscious=1;
  if (rf.indexOf('bleed')!==-1 || a.main==='gi') flags.gi=1;
  if (a.main==='fever' || (isArr(a.risk)&&a.risk.indexOf('hifever')!==-1)) flags.fever=1;
  return flags;
}

/* ---------- Google Maps integration (ไม่ใช้ API key / ไม่ส่งข้อมูลสุขภาพ) ----------
   เปิด Google Maps ค้นหาตามคำค้น โดยถ้าผู้ใช้อนุญาตตำแหน่งจะค้นรอบตำแหน่งนั้น
   ถ้าไม่อนุญาต/ไม่รองรับ จะ fallback เป็นการค้นหาทั่วไป (ไม่ล็อกการใช้งาน)
   ใช้ Google Maps Search URL มาตรฐาน:
     https://www.google.com/maps/search/?api=1&query=<q>
   ส่งเฉพาะคำค้นประเภทสถานพยาบาล + พิกัด ไม่ส่งอาการหรือผลประเมินใด ๆ */
function buildMapsUrl(query, lat, lng){
  var base = 'https://www.google.com/maps/search/?api=1&query=';
  var q = query;
  if (typeof lat === 'number' && typeof lng === 'number'){
    q = query + ' ' + lat.toFixed(5) + ',' + lng.toFixed(5);
  }
  return base + encodeURIComponent(q);
}

function openMapsSearch(query, onDone){
  function go(url){ try{ window.open(url, '_blank', 'noopener'); }catch(e){ location.href = url; } if(onDone) onDone(); }
  if (navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(pos){ go(buildMapsUrl(query, pos.coords.latitude, pos.coords.longitude)); },
      function(){ go(buildMapsUrl(query)); },
      { enableHighAccuracy:false, timeout:8000, maximumAge:300000 }
    );
  } else {
    go(buildMapsUrl(query));
  }
}

    '<div class="nav"><button class="btn btn-ghost btn-block" onclick="renderIntro()">กลับหน้าแรก</button></div>';
}

/* หน้าสัญญาณอันตราย */
function renderDanger(){
  state.step=-1; setBar(); setActiveTab('tab-settings');

  /* Pictogram เฉพาะอาการ (วาดเองในสไตล์ไอคอนเส้นทางการแพทย์)
     สื่ออาการตรงตัว ดูแล้วเข้าใจทันทีว่าเป็นอาการใด เก็บใน dist/img/danger/
     แต่ละรายการ: [ไฟล์ภาพ, หัวข้ออาการ, คำอธิบาย] */
  var IMG = 'img/danger/';
  var d = [
    ['stroke.svg',     'ปากเบี้ยว แขนขาอ่อนแรง พูดไม่ชัดเฉียบพลัน','สัญญาณโรคหลอดเลือดสมอง — ยิ่งเร็วยิ่งดี'],
    ['chest-pain.svg', 'เจ็บแน่นหน้าอกรุนแรง ร้าวไปแขนหรือกราม','สงสัยหัวใจขาดเลือดเฉียบพลัน'],
    ['breathing.svg',  'หายใจไม่ออก หอบรุนแรง ริมฝีปากเขียว','ภาวะหายใจลำบากขั้นวิกฤต'],
    ['unconscious.svg','หมดสติ ปลุกไม่ตื่น หรือชักเกร็ง','ภาวะคุกคามชีวิต'],
    ['bleeding-mouth.svg','เลือดออกไม่หยุด หรืออาเจียน/ถ่ายเป็นเลือดมาก','เสียเลือดมาก อาจช็อก'],
    ['fever.svg',      'ไข้สูงร่วมกับซึมลง สับสน หรือชัก','ภาวะติดเชื้อรุนแรง'],
  ];
  var cards = d.map(function(x){
    return '<div class="dcard">'+
             '<div class="ill"><img src="'+IMG+x[0]+'" alt="'+x[1]+'" loading="lazy" decoding="async"></div>'+
             '<p class="dtitle">'+x[1]+'</p>'+
             '<p class="ddesc">'+x[2]+'</p>'+
           '</div>';
  }).join('');

  mainEl.innerHTML = '<div class="card fade"><h2 class="q-title">สัญญาณอันตราย</h2>'+
    '<p class="q-sub">หากมีอาการตามรูปภาพด้านล่าง ให้โทร 1669 หรือไปห้องฉุกเฉินทันที โดยไม่ต้องรอผลประเมิน (รายการจำลอง)</p></div>'+
    '<div class="danger-grid">'+cards+'</div>'+
    '<div class="card"><a class="call" href="tel:1669"><span class="num">1669</span> โทรแจ้งสายด่วนการแพทย์ฉุกเฉิน</a></div>'+
    '<div class="nav"><button class="btn btn-ghost btn-block" onclick="renderIntro()">กลับหน้าแรก</button></div>';
}

/* Accessibility: ขนาดอักษร + คอนทราสต์สูง (จำค่าใน localStorage) */
var FONT_STEPS = [16,18,20,23]; var fontIdx = 1;
function applyFont(){ document.documentElement.style.setProperty('--fs', FONT_STEPS[fontIdx]+'px'); try{localStorage.setItem('triage_font',String(fontIdx));}catch(e){} }
function setFont(dir){ if(dir===0) fontIdx=1; else fontIdx=Math.max(0,Math.min(FONT_STEPS.length-1,fontIdx+dir)); applyFont(); }
function toggleContrast(){ var on=document.body.classList.toggle('hc'); var b=document.getElementById('hcBtn'); if(b)b.setAttribute('aria-pressed',on?'true':'false'); try{localStorage.setItem('triage_hc',on?'1':'0');}catch(e){} }
function restorePrefs(){ try{ var f=localStorage.getItem('triage_font'); if(f!==null) fontIdx=Math.max(0,Math.min(FONT_STEPS.length-1,parseInt(f,10)||1)); if(localStorage.getItem('triage_hc')==='1'){ document.body.classList.add('hc'); var b=document.getElementById('hcBtn'); if(b)b.setAttribute('aria-pressed','true'); } }catch(e){} applyFont(); }

restorePrefs();
renderIntro();
</script>
</body>
</html>
